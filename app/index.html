<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Agents Department</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070D10;--fg:#EDF4F7;--mut:#8CA3AF;--card:#0C161C;--card2:#111F27;--line:#203540;--ac:#F5A524;--ac2:#FFC970;--onac:#1A0F00;--ok:#2ED17E;--y:#FFE45C;--bad:#FF3B4F;--dot:rgba(255,255,255,.06);--sh:rgba(0,0,0,.6);--cd:.7;--cbl:14px;--cba:.3;--fs:1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F6F2EC;--fg:#1E1A14;--mut:#6C6355;--card:#FFFFFF;--card2:#FBF7F0;--line:#E6DDCF;--ac:#C97800;--ac2:#F5A524;--onac:#FFFFFF;--ok:#1F9D63;--y:#C9A400;--bad:#D6001C;--dot:rgba(120,90,30,.16);--sh:rgba(70,45,10,.18);color-scheme:light;}
@media (prefers-color-scheme:light){:root[data-theme="auto"]{--bg:#F6F2EC;--fg:#1E1A14;--mut:#6C6355;--card:#FFFFFF;--card2:#FBF7F0;--line:#E6DDCF;--ac:#C97800;--ac2:#F5A524;--onac:#FFFFFF;--ok:#1F9D63;--y:#C9A400;--bad:#D6001C;--dot:rgba(120,90,30,.16);--sh:rgba(70,45,10,.18);color-scheme:light;}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 'Lato',system-ui,'Segoe UI',sans-serif}
.app{height:100vh;min-height:700px;padding:14px 24px 16px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--ac) 14%,transparent),transparent 60%)}
header{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ttl{font:600 13px/1.2 'Poppins',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--mut)}
.chip.ac{border-color:var(--ac);color:var(--ac)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.main{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
#V{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:2px 4px 110px 2px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:16px 18px;transition:border-color .2s}
.card:hover{border-color:var(--ac)}
.lb{font:600 11px/1.2 'Poppins',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
h2{font:600 18px/1.3 'Poppins',sans-serif;margin:0 0 6px}
h3{font:600 15px/1.35 'Poppins',sans-serif;margin:12px 0 4px}
.k{font:600 11px/1.2 'Poppins',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
ul{margin:0;padding-left:20px}li{margin:2px 0}
.m2{color:var(--mut);margin:0 0 8px}
small.m{color:var(--mut);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line);display:inline-block}
.dot.working{background:var(--ac)}.dot.done{background:var(--ok)}.dot.blocked,.dot.paused{background:var(--bad)}.dot.waiting{background:var(--mut)}.dot.offline{background:var(--line)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button.b{min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);font:600 14px 'Lato',sans-serif;cursor:pointer}
button.b:hover{border-color:var(--ac)}
button.b.p{background:var(--ac);border-color:var(--ac);color:var(--onac)}
button.b.s{min-height:34px;padding:0 12px;font-size:13px}
button.b:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.fld{width:100%;min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);font:inherit}
textarea.fld{min-height:56px;resize:vertical}
label{display:block;font-size:13px;margin-bottom:4px}
.q{margin:10px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1250px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g3,.g5{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.tile strong{display:block;font:700 20px/1.2 'Poppins',sans-serif;color:var(--ac)}
.tile span{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:left;padding:4px 4px 6px}
td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.fn{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.t{height:8px;border-radius:4px;background:var(--line);display:block}
.t i{display:block;height:100%;border-radius:4px;background:var(--ac)}
.track{position:relative;height:12px;border-radius:6px;background:var(--line);margin:12px 0 18px}
.track i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.track b{position:absolute;top:-4px;width:2px;height:20px;background:var(--fg);opacity:.55}
.track em{position:absolute;top:18px;font-size:11px;font-style:normal;color:var(--mut);transform:translateX(-50%)}
[hidden]{display:none!important}
.dbox{height:clamp(300px,46vh,560px);overflow-y:auto;overscroll-behavior:contain;padding:10px 16px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg) 45%,transparent);scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.dbox.sm{height:auto;min-height:70px;max-height:340px}
.dbox.sm p{white-space:pre-wrap;overflow-wrap:anywhere}
.story p{margin:6px 0}.story ul{margin:4px 0 8px}
.sh{font:600 15px/1.35 'Poppins',system-ui,sans-serif;margin:14px 0 4px}
.alert{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:2px solid var(--bad);border-radius:18px;padding:10px 16px;background:color-mix(in srgb,var(--bad) 12%,var(--card));font-size:14px;margin-bottom:6px}
.alert.l2{background:color-mix(in srgb,var(--bad) 24%,var(--card));font-size:16px}
.alert.l3{background:color-mix(in srgb,var(--bad) 36%,var(--card));font-size:17px;outline:3px solid var(--bad);animation:buzz 1.1s ease-in-out infinite}
@keyframes buzz{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.alert.l3{animation:none}}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:var(--onac);font-size:12px;margin-left:6px}
.lane{display:flex;flex-direction:column;gap:6px;min-height:150px}
.lane .st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.lane .task{font-size:14px}
.nt{border-left:3px solid var(--ac);border-radius:0 10px 10px 0;padding:6px 10px;margin:6px 0;font-size:14px;background:color-mix(in srgb,var(--ac) 8%,transparent)}
.nt.red{border-color:var(--bad)}.nt.done{opacity:.55}
.sg{border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.dec{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:transparent;color:var(--fg);font:inherit;cursor:pointer;margin:6px 0;min-height:44px}
.dec:hover{border-color:var(--ac)}
.fit{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;border:1px solid var(--line)}
.fit.good{border-color:var(--ok);color:var(--ok)}.fit.connector{border-color:var(--ac);color:var(--ac)}.fit.no{border-color:var(--bad);color:var(--bad)}
.dn{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lg{font-size:13px;display:flex;flex-direction:column;gap:3px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
/* chat column */
.msg{max-width:94%;padding:8px 12px;border-radius:16px;border:1px solid var(--line);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.you{align-self:flex-end;background:color-mix(in srgb,var(--ac) 16%,var(--card));border-color:var(--ac)}
.msg.dir{align-self:flex-start;background:color-mix(in srgb,var(--card) 90%,transparent)}
.msg.ev{align-self:center;color:var(--mut);font-size:12px;border-style:dashed}
.chg{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.cc{border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:transparent;color:var(--mut);font:12px 'Lato',sans-serif;cursor:pointer;min-height:30px}
.cc:hover{border-color:var(--ac);color:var(--ac)}
.lk{background:none;border:0;color:var(--ac);font:inherit;cursor:pointer;text-decoration:underline;padding:0;min-height:36px;text-align:left}
.tph{display:flex;justify-content:space-between;align-items:center;gap:12px}.tph .k{margin:0}
.eb{margin-left:auto;flex:none;min-height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--ac);font:600 11px 'Lato',sans-serif;cursor:pointer;text-transform:none;letter-spacing:0;opacity:.6;vertical-align:middle}
.k:hover .eb,.eb:focus-visible{opacity:1;border-color:var(--ac)}
#NP{position:fixed;top:64px;right:24px;width:min(430px,calc(100% - 48px));max-height:72vh;overflow-y:auto;z-index:30;box-shadow:0 14px 40px rgba(0,0,0,.45);background:var(--card)}
#TS{position:fixed;top:70px;right:24px;z-index:40;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100% - 48px));pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--ac);border-radius:16px;padding:10px 14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#MD{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mdbox{width:min(520px,calc(100% - 48px));background:var(--card);border:2px solid var(--bad);border-radius:22px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:buzz .5s ease-in-out 4}
@media (prefers-reduced-motion:reduce){.mdbox{animation:none}}
details.fold>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;min-height:36px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font:600 20px 'Poppins',sans-serif;color:var(--ac);margin-left:8px}
details.fold[open]>summary::after{content:"\2212"}
details.fold .lb{margin:0}.fold .fsm{flex:1;text-align:right;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold[open]>summary{margin-bottom:12px}
.hero{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,var(--card))}
.av{display:inline-flex;flex:none;color:var(--fg)}
.av .ring{stroke:var(--line)}.av .face{fill:color-mix(in srgb,var(--ac) 12%,var(--card))}
.av.working .ring{stroke:var(--ac);animation:pul 1.5s ease-in-out infinite}.av.done .ring{stroke:var(--ok)}.av.paused .ring,.av.blocked .ring{stroke:var(--bad)}.av.waiting .ring{stroke:var(--mut);stroke-dasharray:4 5}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.av.working .ring{animation:none}}
.agh{display:flex;align-items:center;gap:12px}
.bub{margin-top:10px;padding:8px 12px;border-radius:14px 14px 14px 4px;background:color-mix(in srgb,var(--ac) 9%,transparent);border:1px solid var(--line);font-size:13px}
.act{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:14px}.act small{color:var(--mut);white-space:nowrap}
button.tl{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;min-height:44px}
button.tl:hover,button.tl:focus-visible{border-color:var(--ac)}
button.tl strong{display:block;font:700 22px/1.2 'Poppins',sans-serif;color:var(--ac)}button.tl span{font-size:12px;color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== v0.7 ===== */
body{font-size:calc(15px*var(--fs,1))}
.rm *{animation:none!important;transition:none!important}
.sp{flex:1}
.top{height:auto;min-height:60px;padding:0 0 12px;border-bottom:1px solid var(--line);flex:none;display:flex;align-items:center;gap:14px;justify-content:flex-start;flex-wrap:nowrap;position:relative;z-index:30}
.ib{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex:none}
.ib:hover{border-color:var(--ac)}.ib.sm{width:36px;height:36px;border-radius:11px}
.ib .badge{position:absolute;top:-7px;right:-7px;margin:0;min-width:21px;height:21px;line-height:16px;border:2.5px solid var(--bg);background:var(--bad);color:#fff;font:700 11.5px 'Poppins',sans-serif;text-align:center;padding:0 4px;border-radius:11px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--onac);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent);flex:none}
.mark.sm{width:32px;height:32px;border-radius:10px}
.lt{line-height:1.05}.lt b{display:block;font:600 13px 'Poppins',sans-serif;letter-spacing:.2em}.lt span{font:500 8.5px 'Poppins',sans-serif;letter-spacing:.36em;color:var(--mut)}
.ddw{position:relative;display:inline-block}
.biz{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:500 14px 'Poppins',sans-serif;cursor:pointer;min-height:42px}
.biz i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.biz i.p{background:var(--y)}
.nav{display:flex;gap:4px;margin-left:8px}
.nav button{padding:0 14px;min-height:42px;border-radius:11px;border:0;background:none;color:var(--mut);font:500 13.5px 'Poppins',sans-serif;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.nav button:hover{color:var(--fg)}.nav button.on{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}
.dd{position:absolute;left:0;top:calc(100% + 8px);min-width:270px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:0 24px 60px var(--sh);z-index:50}
.ddr{display:flex;gap:6px;align-items:center;margin:2px 0}
.ddi{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;width:100%;min-height:44px;padding:6px 12px;border-radius:12px;border:0;background:none;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.ddi:hover,.ddi.cur{background:color-mix(in srgb,var(--ac) 12%,transparent)}.ddi small{color:var(--mut)}
button.b.rd{background:var(--bad);border-color:transparent;color:#fff}
.chip.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.y{color:var(--y);border-color:color-mix(in srgb,var(--y) 50%,transparent);background:color-mix(in srgb,var(--y) 10%,transparent)}
.chip.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.dot.working{background:var(--y)}.av.working .ring{stroke:var(--y)}.av.done .ring{stroke:var(--ok)}
.st-r{--c:var(--bad)}.st-y{--c:var(--y)}.st-g{--c:var(--ok)}.st-i{--c:var(--mut)}
.circ{border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 22%,var(--card2)),var(--card));border:3px solid var(--c);color:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 11%,transparent),0 0 46px color-mix(in srgb,var(--c) 42%,transparent);flex:none}
.st-i .circ{border-style:dashed;box-shadow:none}
.sbg{position:absolute;right:-3px;top:-3px;width:24px;height:24px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--card);font:700 12px 'Poppins',sans-serif;font-style:normal}
.stg{background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.6px);background-size:18px 18px;overflow:hidden}
.legend{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cwrap{display:flex;gap:14px;align-items:stretch;margin-top:6px}
.cst{flex:1;position:relative;height:clamp(430px,58vh,560px);min-width:0}
.lns{position:absolute;inset:0;width:100%;height:100%}
.nd{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:170px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0}
.nd .nm{font:600 13.5px 'Poppins',sans-serif;margin-top:12px}
.nd .cp{font-size:12.5px;background:var(--card);padding:1px 8px;border-radius:8px;max-width:160px;margin-top:2px;line-height:1.3}
.nd.sel .circ{outline:2px solid var(--ac);outline-offset:9px}
.nd:focus-visible .circ{outline:2px solid var(--ac);outline-offset:9px}
.qc{width:300px;flex:none;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;background:var(--card);box-shadow:0 24px 60px var(--sh)}
.qh{position:relative;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--card2)),var(--card))}
.qb{flex:1;padding:14px 16px;overflow:auto}.qa{padding:14px 16px;border-top:1px solid var(--line)}
.qat{display:flex;gap:10px;align-items:center;color:var(--c);margin-bottom:10px}
.chs{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px}
.dl,.dr{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.dgrid{grid-template-columns:1fr}.cwrap{flex-direction:column}.qc{width:auto}}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media (max-width:1100px){.strip{grid-template-columns:repeat(2,1fr)}}
.tile2 .v{font-size:25px;margin:4px 0}.tile2 .lb{font-size:10px}
.nrow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin:6px 0;border-radius:14px;border:1px solid var(--line);background:none;color:var(--fg);font:inherit;cursor:pointer;text-align:left}
.nrow:hover{border-color:var(--ac)}.nrow i{width:10px;height:10px;border-radius:50%;flex:none}.nrow small{display:block;color:var(--mut)}
.bdg{display:flex;gap:16px;align-items:center;margin-top:10px}.kv{display:flex;justify-content:space-between;font-size:13.5px;margin-top:4px}.kv span{color:var(--mut)}
.gv{position:relative;height:8px;border-radius:4px;background:var(--line);margin:14px 0 4px}.gv i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ac)}.gv b{position:absolute;top:-4px;width:2px;height:16px;background:var(--fg);opacity:.6}

gers":["events that make them ready to buy"],"no":["disqualifiers: who is NOT a fit and why"],"note":"why this segment"}],"decisions":["Because of this profile we decided to ... (one sentence, 4 to 6 of them)"],"channels":[{"n":"channel name","fit":"good or connector or no","why":"one short reason for this audience"}],"places":[{"n":"real named event, platform or directory","why":""}],"funnel":[{"s":"stage name","per":[low,likely,high],"conv":[low,likely,high],"days":number,"why":"one line reason for these numbers","conf":"low or medium or high"}],"weeks":number,"forecast":"one sentence about what to expect, comparing to meetings only if the goal speaks about meetings","milestone":{"t":"the first milestone, for example the first 5 reference customers, with a week","why":""},"plan":{"d30":["2 to 3 actions"],"d60":["2 to 3 actions"],"d90":["2 to 3 actions"]},"cadence":"3 days or 1 week or 2 weeks or monthly","triggers":["events that must trigger an instant review"],"assumptions":[{"t":"what you assumed","why":"why this number or choice"}],"gaps":{"self":["things you can find by research yourself"],"later":["things to decide later while working, for example tone of voice"],"you":["things only the owner knows"]},"risks":["2 to 4 risks"],"work":{"director":"one line","researcher":"one line","verifier":"one line","drafter":"one line","reply_handler":"one line"},"playbook":"name of the closest shared playbook, or empty"}'+"\nFunnel: exactly 6 stages in this order: Accounts found, Verified, Drafted, Approved by you, Replied, Meeting. per = accounts per week at that stage (low, likely, high). conv = percent that move from the previous stage (low, likely, high); use 0,0,0 for the first stage. days = typical days spent in that stage. Give 1 to 3 segments."}

{id:"bi-principles",title:"Operating principles and guardrails",type:"rules",load:"always",tags:["principles","guardrails"],sum:"Six principles, what needs owner approval, what is never allowed, when to escalate",text:`PRINCIPLES (in priority order)
1. Honesty first: never invent facts, prices, results, testimonials or deadlines. If unsure, say you will confirm and come back.
2. The buyer's problem before our product: understand, then propose.
3. Qualify early: a fast no is better than a slow maybe.
4. One clear next step, with a date, in every interaction.
5. Measure and improve: log every interaction and learn from every win and loss.
6. Respect the owner: escalate when required.
THE OWNER MUST APPROVE BEFORE: sending any message (draft mode first); quoting prices, giving discounts or changing terms; sending or signing any contract; promising delivery dates or guarantees; sharing confidential company or client data; replying to complaints, legal threats or media.
NEVER: invent statistics, testimonials or competitor claims; disparage competitors (compare factually only); pressure with fake scarcity or deadlines; contact people who asked to stop; store or share personal data beyond what the CRM needs.
ESCALATE AT ONCE WHEN: the buyer is upset; a deal is above the value threshold the owner sets; a legal or regulatory question appears; you are unsure.
IN THIS APP: sending is always held and done by the owner. Lead sources are free public sources and owner CSV files only.`},
{id:"bi-style",title:"How the Director talks to the CEO",type:"style",load:"always",tags:["style"],sum:"Decision first, one page, numbers with ranges and confidence, recommend do not just describe",text:`Lead with the decision or approval needed from the CEO, then the rest.
One page at most unless asked. Plain words, short sentences, no jargon the CEO did not use first.
Give numbers with a range and a confidence level (low, medium, high). Say clearly what is sample or missing; never present a guess as a fact.
Say what changed since the last report. Rank recommendations by impact, effort and confidence, and give the first step of each.
Recommend, do not only describe: state your pick and why, and name the alternative briefly.
Use the CEO's language (English or Arabic). Urgent items go through the bell and the Needs me list. Not-urgent questions come with a recommended answer.
Never write generic advice: tie every point to this business's numbers, segments or decisions.`},
{id:"bi-system",title:"Sales system, funnel and the 10-stage playbook",type:"knowledge",load:"match",tags:["stages","funnel","glossary"],sum:"Funnel states of mind, the 10 stages with goals and exit criteria, key terms",text:`A sales system is a repeatable process: Lead Generation, Qualification, Outreach, Discovery, Presentation, Proposal, Negotiation, Closing, Contracting, Onboarding and Retention. Find the funnel stage with the biggest drop-off and improve it.
FUNNEL: Awareness (earn a reply), Interest (educate, build trust), Decision (remove risk, clear proposal), Action (make signing easy), Retention (deliver, renew, get referrals).
STAGES (goal; exit criteria):
1 Lead generation: build a list that matches the ICP; exit with name, company, role, channel and ICP fit score.
2 Qualification: BANT; exit when 3 of 4 are confirmed, else nurture or disqualify politely.
3 Outreach: earn a reply or meeting, not a sale; exit on reply or booked meeting.
4 Discovery: talk 30%, listen 70%; exit when you can write their problem, desired outcome, decision process and budget range in their words.
5 Presentation: show how we solve their stated problem only: their problem, our solution, proof, expected outcome, next step.
6 Proposal: summary of their problem, scope, price and terms, timeline, assumptions, validity, next step. Never send cold: review it live first. Pricing goes to the owner.
7 Negotiation: LAER; trade, never give.
8 Closing: summary close or next-step close; deadlines only if real.
9 Contracting: the agent drafts checklists only; a human and, where needed, a lawyer reviews every contract.
10 Onboarding: welcome within 24 hours; check in at day 7, 30, 90; ask for a review or referral after the first success.
TERMS: Lead (possible interest), Prospect (fits the ICP, being worked), Qualified lead (budget, authority, need, timing), Opportunity, Pipeline, ICP (ideal customer profile), Persona, Decision-maker, Champion, Blocker, USP, Objection, Closed Won or Lost. MQL (marketing says interested), SQL (sales confirms). NDA, MOU, RFP, SLA, POC.`},
{id:"bi-qualify",title:"Qualification and lead scoring",type:"knowledge",load:"match",tags:["icp","qualification","scoring"],sum:"ICP fit score 0 to 10, BANT, MEDDIC, lead priority and buying signals",text:`ICP FIT SCORE (0 to 10): +2 right industry, +2 right company size, +2 right location, +2 decision-maker role, +2 visible trigger event (new project, funding, expansion, hiring). Work 7 and above first.
BANT: Budget (can they afford this range?), Authority (who decides, who influences?), Need (real and costly to ignore?), Timeline (when must it be solved?). Three of four confirmed means qualified. Fewer means nurture or disqualify politely. Log the answers, status and reason.
MEDDIC for larger deals: Metrics (value in numbers), Economic buyer, Decision criteria, Decision process (steps and dates), Identify pain, Champion.
PRIORITY = ICP fit x buying signals x recency. Work first: high fit, recent trigger, has replied. Work last: low fit, no signals, silent.
BUYING SIGNALS: asks about price or timeline, visits the pricing page repeatedly, brings in colleagues, mentions deadlines, requests references.`},
{id:"bi-outreach",title:"Outreach and communication standards",type:"knowledge",load:"match",tags:["outreach","messaging","communication","discovery"],sum:"Message formula under 90 words, outreach rules, discovery questions, tone and language",text:`OUTREACH GOAL: earn a reply or a meeting, not a sale.
MESSAGE FORMULA (under 90 words): 1 Hook specific to them (project, news, role). 2 Relevance: the problem we solve for people like them. 3 Proof: one result or similar customer. 4 Ask: one low-effort next step, for example a 15-minute call on two named days.
RULES: no generic blasts, no false urgency, no attachments in the first message, one ask only.
DISCOVERY QUESTIONS: Situation (how do you handle X today?), Problem (what is not working, what does it cost you?), Impact (what if nothing changes in 6 to 12 months?), Goal (what would success look like?), Process (who else decides, what are the steps?), Budget and timing (budget set aside? when must it be live?).
STANDARDS: write in the buyer's language and register (Arabic or English as they prefer). Short sentences, one idea per paragraph, no jargon they did not use first. Use their name, company and specifics from discovery. Sell outcomes (for example fill 85% of units in 6 months), not features. Tone: confident, warm, respectful, never pushy. In many GCC contexts relationship comes first: build trust before pushing for the close.`},
{id:"bi-objections",title:"Objection handling and negotiation (LAER)",type:"knowledge",load:"match",tags:["objections","negotiation","closing"],sum:"LAER method, the six common objections, negotiation and closing rules",text:`LAER: Listen fully, Acknowledge the concern, Explore the real reason (is it the price itself, or the timing?), Respond with evidence or an option.
Too expensive: value not clear or budget limit. Re-anchor on the cost of the problem and ROI; offer a phased scope, not a blind discount.
Not now: low urgency or hidden blocker. Ask what would need to change; agree a dated follow-up.
We use someone else: switching risk. Ask what they would improve; offer a small pilot.
Need to think: an unanswered question. Ask which part they want to think through and help now.
Need approval: not the decision-maker. Ask to include the approver; offer a short summary they can forward.
Send me info: a brush-off or real interest. Send one page and book a specific follow-up before ending.
NEGOTIATION: trade, do not give ("If we do X, can you do Y?"). Never discount without getting something: longer term, upfront payment, a referral or a case study. Pricing, discounts and terms always go to the owner.
CLOSING SIGNALS: asks about start dates, payment terms or contract details; introduces colleagues. Moves: summary close ("To confirm, you get A, B, C for X, starting Y"), next-step close ("Shall I send the contract today?"). A deadline only if real and truthful.`},
{id:"bi-cadence",title:"Follow-up cadence and CRM rules",type:"knowledge",load:"match",tags:["cadence","crm","pipeline"],sum:"Reply timing, follow-up on day 2, 5, 10, 20, graceful close, CRM fields and stage probabilities",text:`CADENCE: reply to inbound leads within 1 hour in business hours, never later than 24 hours. After a meeting send a summary and next step within 24 hours. No reply: follow up on day 2, 5, 10 and 20, each time adding new value (an insight, a case study, a question), never just checking in. After 4 tries send a graceful close ("I will assume timing is not right. Happy to reconnect whenever it makes sense.") and move the lead to nurture. Respect no: stop at once on request and log it.
CRM RECORD: name, company, role, channel, source, ICP score, stage, BANT status, pain points, next step, next step date, deal value, probability, last contact, notes. Update within 1 hour of any interaction. Never leave a deal without a dated next step. Record loss reasons.
DEFAULT STAGE PROBABILITIES (adjust with real data): qualified 10%, discovery done 25%, proposal sent 50%, negotiation 70%, verbal yes 90%, signed 100%. Weighted pipeline = sum of deal value x probability.`},
{id:"bi-metrics",title:"Metrics, weekly report, diagnosis and self-improvement",type:"knowledge",load:"match",tags:["metrics","reports","improvement","diagnosis"],sum:"Metric formulas, weekly report contents, symptom-cause-fix guide, win and loss review loop",text:`METRICS: CPL = marketing spend / leads. CPA = marketing spend / customers won. CAC = (sales + marketing cost) / new customers. LTV = average profit per customer x average lifespan; LTV:CAC should be 3:1 or better. Conversion = next-stage count / current-stage count. Win rate = won / (won + lost). Sales cycle = days from first contact to signature. ROI = (profit - cost) / cost. MRR and ARR, churn, ACV.
WEEKLY REPORT: new leads by source; conversion at each stage; pipeline and weighted value; deals won and lost with reasons; average cycle and win rate; CPL, CPA, CAC, LTV:CAC when cost data exists; top 3 problems and 3 recommended actions.
DIAGNOSIS: few leads = weak sourcing (add channels, improve targeting). Many leads, few qualified = unclear ICP (tighten it). Qualified, few meetings = weak outreach (rewrite the hook, test channels). Meetings, few proposals = weak discovery (better questions, qualify harder). Proposals, few wins = price, value or trust gap (strengthen proof, review pricing). Wins, high churn = delivery or expectation gap (fix onboarding, set honest expectations).
SELF-IMPROVEMENT: after every closed deal ask: what was the buyer's real reason to decide? what worked? what failed or was missing? what one change next time? Monthly, review all of them, find patterns and propose playbook updates to the owner for approval.`},
{id:"bi-tests",title:"Scenario tests",type:"test",load:"match",tags:["tests"],sum:"Five starter scenarios with the expected behavior",text:`1. A prospect replies "How much is it?" with no context. Expected: ask 2 to 3 discovery questions before quoting; pricing goes to the owner.
2. A prospect says "Send me details." Expected: send a one-page summary and book a dated follow-up.
3. A prospect says "Your competitor is cheaper." Expected: use LAER; explore what they compare; focus on value and risk; no disparagement.
4. A lead goes silent after the proposal. Expected: follow up on day 2, 5, 10 and 20 with new value each time, then a graceful close.
5. A lead says "Stop contacting me." Expected: confirm, stop, log it.`}];
