<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- sales-agents-department interface -->
<meta name="ui-version" content="1.0.1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Agents Department</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{--cmp:0px}
:root{--bg:#F6F2EC;--s1:#FFFFFF;--s2:#FBF7F0;--s3:#EFE7DA;--line:#E6DDCF;--fg:#1E1A14;--mut:#6C6355;--ac:#C97800;--acbg:rgba(201,120,0,.10);--onac:#FFFFFF;--ok:#1F9D63;--y:#9A7300;--bad:#D6001C;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070D10;--s1:#0C161C;--s2:#111F27;--s3:#16262F;--line:#203540;--fg:#EDF4F7;--mut:#8CA3AF;--ac:#F5A524;--acbg:rgba(245,165,36,.10);--onac:#1A0F00;--ok:#2ED17E;--y:#FFE45C;--bad:#FF5A6B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070D10;--s1:#0C161C;--s2:#111F27;--s3:#16262F;--line:#203540;--fg:#EDF4F7;--mut:#8CA3AF;--ac:#F5A524;--acbg:rgba(245,165,36,.10);--onac:#1A0F00;--ok:#2ED17E;--y:#FFE45C;--bad:#FF5A6B;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;min-height:100vh;padding-bottom:90px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--s1)}
.logo{font-weight:700;margin-right:8px}.logo i{display:inline-block;width:10px;height:10px;background:var(--ac);border-radius:3px;margin-right:8px}
.tab{padding:6px 11px;border-radius:9px;color:var(--mut);font-size:13px;background:transparent}.tab.on{background:var(--s3);color:var(--fg)}
.sp{flex:1}.m{color:var(--mut)}.sm{font-size:13.5px}.b{font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding:18px 20px}
h1{font-size:22px}h2{font-size:24px;line-height:1.2}h3{font-size:15px}
.lb{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);font-weight:600}
button,select,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:7px 13px;background:var(--s3);color:var(--fg);font-size:13px}
button.p{background:var(--ac);color:var(--onac);font-weight:600}button.s{padding:3px 10px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea,select{background:var(--s3);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px;width:100%}
textarea{min-height:60px;resize:vertical}select{width:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel{background:var(--s1);border-radius:14px;padding:15px 17px;margin-top:14px}.panel.f{margin-top:0}
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--s1);border-radius:12px;padding:10px 16px;margin:12px 0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.ok{background:var(--ok)}.y{background:var(--y)}.i{background:#7B8C96}.r{background:var(--bad)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--s3)}
.pill.ok{background:rgba(46,209,126,.16);color:var(--ok)}.pill.y{background:rgba(255,200,0,.16);color:var(--y)}.pill.bad{background:rgba(255,59,79,.14);color:var(--bad)}.pill.ac{background:var(--acbg);color:var(--ac)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1250px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:1fr}}
.col{background:var(--s1);border-radius:14px;padding:12px 11px;min-height:180px}.col.found{border:1px dashed var(--line)}
.ch{display:flex;align-items:center;gap:8px;padding:0 3px 6px}.num{font-size:12px;background:var(--s3);border-radius:99px;padding:1px 9px}
.card{display:block;width:100%;text-align:start;background:var(--s2);border-radius:11px;padding:10px 12px;margin-top:8px;border-left:3px solid var(--ok);color:var(--fg)}
.card.y{border-left-color:var(--y)}.card.r{border-left-color:var(--bad)}.card:hover{background:var(--s3)}
.sc{float:right;font-weight:700;color:var(--ac)}
.tagp{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--acbg);color:var(--ac);margin-top:4px}
.flist{max-height:480px;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1.05fr;gap:14px;align-items:start}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:start}
@media (max-width:900px){.grid,.two{grid-template-columns:1fr}}
.track{display:flex;overflow-x:auto;padding:6px 2px 2px}.tn{flex:1;min-width:76px;text-align:center;position:relative;font-size:12px;color:var(--mut)}
.tn::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}.tn:first-child::before{display:none}
.tn .c{position:relative;width:26px;height:26px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--s3);font-size:12px;border:2px solid transparent}
.tn.done .c{background:rgba(46,209,126,.18);color:var(--ok)}.tn.done::before,.tn.cur::before{background:var(--ok)}
.tn.cur .c{border-color:var(--ac);color:var(--ac);background:var(--acbg)}.tn.cur{color:var(--fg);font-weight:600}.track.lost{opacity:.5}
.prob{border-radius:11px;padding:10px 12px;margin-top:8px;background:var(--s2);border:1px solid transparent}.prob.lead{border-color:var(--ac);background:var(--acbg)}
.draft{background:var(--s2);border-radius:11px;padding:14px;line-height:1.65;white-space:pre-wrap;border:1px dashed var(--ac);min-height:130px}
.sent{background:var(--s2);border-radius:11px;padding:14px;line-height:1.65;white-space:pre-wrap;border:1px solid var(--line)}
.src ul{list-style:disc;margin:3px 0 0 18px;padding:0}.src li{margin:3px 0}.src a{color:var(--ac)}
.log div{padding:6px 0;border-top:1px solid var(--line);font-size:13px}.log div:first-child{border-top:0}
.chk{display:flex;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}.chk:first-child{border-top:0}
table{width:100%;border-collapse:collapse}th{text-align:start;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:6px 8px}td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
.field{display:grid;grid-template-columns:220px 1fr;gap:6px 14px;padding:9px 0;border-top:1px solid var(--line)}.field:first-of-type{border-top:0}
@media (max-width:700px){.field{grid-template-columns:1fr}}
.q{font-size:12px;color:var(--mut);font-style:italic;margin-top:3px}
.conv{display:grid;grid-template-columns:250px 1fr 300px;gap:14px;align-items:start}
@media (max-width:1100px){.conv{grid-template-columns:1fr}}
.th{display:block;width:100%;text-align:start;padding:9px 11px;border-radius:10px;margin-top:5px;background:transparent}.th.on{background:var(--s3)}
.msgs{max-height:480px;overflow:auto;padding-right:4px}
.msg{max-width:84%;padding:10px 13px;border-radius:13px;margin-top:10px;line-height:1.55}.msg.me{background:var(--acbg);border:1px solid var(--ac);margin-inline-start:auto}.msg.dir{background:var(--s2)}
.und{border-left:3px solid var(--ac);background:var(--s2);border-radius:10px;padding:11px 13px;margin-top:10px}
.rec{border:1px solid var(--ac);background:var(--acbg);border-radius:10px;padding:9px 12px;margin-top:8px}
.bar{height:8px;background:var(--s3);border-radius:8px}.bar i{display:block;height:8px;border-radius:8px;background:var(--ok)}
.seg{display:inline-flex;background:var(--s2);border-radius:10px;padding:2px;flex-wrap:wrap}.seg label{padding:4px 10px;border-radius:8px;font-size:12.5px;cursor:pointer}.seg input{position:absolute;opacity:0;width:0}.seg label:has(input:checked){background:var(--s3);font-weight:600}
.cw{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(660px,94vw);z-index:4}
.cwbox{background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:12px;font-size:13px;max-width:90vw;z-index:6}
.banner{background:rgba(255,59,79,.12);border:1px solid var(--bad);border-radius:11px;padding:9px 13px;margin-top:10px;font-size:13px}
.note{background:var(--acbg);border-radius:10px;padding:8px 12px;font-size:13px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--s1);border-inline-end:1px solid var(--line);padding:14px 10px}
.main{min-width:0}.topline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--s1)}
.grp{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin:16px 10px 4px}
.navb{display:flex;gap:10px;align-items:center;width:100%;text-align:start;padding:9px 11px;border-radius:10px;background:transparent;margin-top:2px;font-size:15px}
.navb svg{width:19px;height:19px;flex:none}.navb:hover{background:var(--s3)}.navb.on{background:var(--acbg);color:var(--ac);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}.kpi{background:var(--s1);border-radius:12px;padding:12px 14px}.kv{font-size:24px;font-weight:700;color:var(--ac);line-height:1.2}
.chipbox{background:var(--s2);border-radius:12px;padding:10px 12px;min-width:170px;flex:1}
.oxl{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}@media (max-width:1000px){.oxl{grid-template-columns:1fr}}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px;border-inline-end:0;border-bottom:1px solid var(--line)}.side .logo,.side .grp{display:none}.navb{width:auto;padding:7px 10px;font-size:13.5px}.navb svg{display:none}}
[dir=rtl] [style*="margin-left:auto"]{margin-left:0!important;margin-right:auto!important}
[dir=rtl] .sc{float:left}[dir=rtl] .tn::before{left:50%;right:-50%}[dir=rtl] .tn:first-child::before{display:none}
[dir=rtl] .q{font-style:normal}.kv{direction:ltr;unicode-bidi:isolate}[dir=rtl] .kv{text-align:right}
.xt{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}.xt th{background:var(--s2);text-align:start;padding:10px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap}.xt th small{display:block;font-weight:400;color:var(--mut);font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace}.xt td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.xt tbody tr:hover td,.xt tr.sel td{background:var(--s2)}.na{color:var(--mut);opacity:.75}
.tr{display:grid;grid-template-columns:1.2fr 2.2fr 1.1fr .9fr 1.4fr 1.3fr;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}.tr.hd{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);border-top:0}.tr.sel{background:var(--s2);border-radius:10px}
@media (max-width:1000px){.tr{grid-template-columns:1fr 1fr}.tr.hd{display:none}}

/* ---------- Step 2: amber HUD (scoped with h- classes; body.hud remaps old components) ---------- */
body.hud{--bg:#0B0C0F;--s1:#15171B;--s2:#1B1E23;--s3:#22262C;--line:#262A31;--fg:#ECE8DF;--mut:#B0AB9E;--ac:#FFA31A;--acbg:#2A1D0A;--onac:#0B0C0F;--ok:#7FD6A5;--y:#FFD36B;--bad:#FF8FA3;--h-am2:#FFC24D;--h-amd:#7A5214;--h-l1:#30343B;--h-l2:#3A3F47;--h-div:#262A31;--h-lab:#A39E91;--h-card:#1B1E23;--h-input:#0F1114;--h-panel:#15171B;--h-w:#FFD36B;--h-wb:#7A5A14;--h-wg:#2A210B;--h-q:#FF7A3D;--h-qb:#7A3410;--h-qg:#2A150B;--h-ag:#9FC4EE;--h-agb:#2F5F8F;--agg:#12202F;--h-er:#FF8FA3;--h-erb:#7A2B3D;--h-erg:#2A1220;--fh:"Rajdhani","Bahnschrift","Segoe UI",sans-serif;--fb:"Space Grotesk","Segoe UI",system-ui,sans-serif;--fm:"JetBrains Mono",ui-monospace,Consolas,monospace;font-family:var(--fb);background:#07080A}
[dir=rtl] body.hud{--fh:"Cairo","Segoe UI",Tahoma,sans-serif;--fb:"Cairo","Segoe UI",Tahoma,sans-serif;--fm:"Cairo","Segoe UI",Tahoma,sans-serif}
[dir=rtl] body.hud *{letter-spacing:0!important}[dir=rtl] .h-frame *{text-transform:none!important}
body{padding-top:var(--cmp)}
.cmp{position:fixed;top:0;inset-inline:0;height:46px;background:#0A0B0D;border-bottom:1px solid #30343B;display:flex;align-items:center;gap:10px;padding:0 14px;z-index:50;color:#CFCABD;font:500 13px "Segoe UI",system-ui,sans-serif}
.cmp button{height:30px;padding:0 14px;border-radius:5px;border:1px solid #3A3F47;background:#1B1E23;color:#ECE8DF;font:600 12px "Segoe UI",system-ui,sans-serif;cursor:pointer}.cmp button.on{background:#FFA31A;border-color:#FFA31A;color:#0B0C0F}.cmp .sp{flex:1}
.side{top:var(--cmp)!important;height:calc(100vh - var(--cmp))!important}
.h-frame{position:relative;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - var(--cmp));background:var(--bg);overflow:clip;align-items:start}
.h-frame::before,.h-frame::after{content:"";position:absolute;inset-inline:0;height:2px;background:var(--ac);box-shadow:0 0 14px 2px rgba(255,163,26,.55);z-index:3}.h-frame::before{top:0}.h-frame::after{bottom:0}
.h-sb{background:#0D0E11;border-inline-end:1px solid var(--h-div);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.h-brand{display:flex;gap:10px;align-items:center}.h-logo{width:34px;height:34px;border:2px solid var(--ac);border-radius:6px;box-shadow:0 0 14px rgba(255,163,26,.38);display:grid;place-items:center;color:var(--h-am2)}
.h-brand b{font:700 18px var(--fh);text-transform:uppercase;letter-spacing:.06em;display:block;line-height:1.1;color:var(--fg)}.h-brand span{font:400 11px var(--fm);color:var(--h-lab);text-transform:uppercase;letter-spacing:.12em}
.h-biz{background:var(--h-input);border:1px solid var(--h-l2);border-radius:6px;padding:10px 12px}.h-biz select{width:100%;background:transparent;border:0;color:var(--fg);font:600 14px var(--fb);padding:2px 0}.h-biz .h-r{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;background:none}
.h-mono{font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--h-lab)}.h-eye{font-family:var(--fm);font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ac);text-shadow:0 0 10px rgba(255,163,26,.35)}
.h-nav{display:flex;flex-direction:column;gap:2px}.h-ni{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:6px;border:1px solid transparent;background:none;color:#CFCABD;font:500 14px var(--fb);text-align:start;cursor:pointer;width:100%}.h-ni svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.h-ni:hover{background:var(--h-card)}.h-ni.on{border-color:var(--ac);background:var(--acbg);color:var(--h-am2);box-shadow:0 0 14px rgba(255,163,26,.28)}
.h-ni.sm{height:32px;font-size:13px;color:var(--h-lab)}
.h-ag{margin-top:auto;border-top:1px solid var(--h-div);padding-top:12px}.h-ag .row{display:flex;align-items:center;gap:8px;height:30px;color:#CFCABD;font-size:13px}.h-ag .row .s{margin-inline-start:auto;font:500 10px var(--fm);text-transform:uppercase;letter-spacing:.12em;color:var(--h-lab)}
.h-dot{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block;flex:none}.h-dot.w{background:var(--h-w);box-shadow:0 0 8px var(--h-w)}.h-dot.q{background:var(--h-q);box-shadow:0 0 8px var(--h-q)}.h-dot.e{background:var(--h-er);box-shadow:0 0 8px var(--h-er)}
.h-mn{min-width:0}.h-tb{min-height:84px;border-bottom:1px solid var(--h-div);display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 24px;background:#0C0D10}.h-tb h2{font:700 30px/1.1 var(--fh);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 0 14px rgba(255,163,26,.28);color:var(--fg)}.h-tb .sp{flex:1}
.h-meter{min-width:170px}.h-meter .h-mono{display:flex;justify-content:space-between;gap:12px}
.h-body{padding:22px 24px}.h-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}.h-c3{grid-column:span 3}.h-c4{grid-column:span 4}.h-c6{grid-column:span 6}.h-c8{grid-column:span 8}.h-c12{grid-column:span 12}.h-c2{grid-column:span 2}
.h-hud{position:relative;background:var(--h-panel);border:1px solid var(--h-l1);border-radius:6px;box-shadow:inset 0 2px 10px rgba(0,0,0,.5);padding:18px;min-width:0}
.h-hud::before{content:"";position:absolute;inset:-1px;pointer-events:none;border-radius:6px;background:linear-gradient(var(--ac),var(--ac)) top left/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) top left/2px 16px no-repeat,linear-gradient(var(--ac),var(--ac)) top right/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) top right/2px 16px no-repeat,linear-gradient(var(--ac),var(--ac)) bottom left/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) bottom left/2px 16px no-repeat,linear-gradient(var(--ac),var(--ac)) bottom right/16px 2px no-repeat,linear-gradient(var(--ac),var(--ac)) bottom right/2px 16px no-repeat}
.h-hud h3{font:700 17px var(--fh);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 12px;color:var(--fg)}
.h-crd{background:#17191D;border:1px solid var(--h-l1);border-radius:6px;padding:10px 12px;box-shadow:inset 0 2px 8px rgba(0,0,0,.45)}
.h-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:4px;border:1px solid var(--h-l2);background:var(--h-card);color:var(--mut);font:500 11px var(--fm);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.h-chip.w{color:var(--h-w);border-color:var(--h-wb);background:var(--h-wg)}.h-chip.q{color:var(--h-q);border-color:var(--h-qb);background:var(--h-qg)}.h-chip.a{color:var(--h-ag);border-color:var(--h-agb);background:var(--agg)}.h-chip.e{color:var(--h-er);border-color:var(--h-erb);background:var(--h-erg)}.h-chip.m{color:var(--ac);border-color:var(--h-amd);background:var(--acbg)}.h-chip.nw{color:var(--h-ag);border-style:dashed}
.h-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:6px;border:1px solid var(--h-l2);background:var(--h-card);color:var(--fg);font:600 13px var(--fb);cursor:pointer}.h-btn:hover{border-color:var(--ac)}.h-btn.p{background:var(--ac);border-color:var(--ac);color:#0B0C0F;box-shadow:0 0 14px rgba(255,163,26,.38)}.h-btn.sm{height:32px;padding:0 12px;font-size:12px}.h-btn:disabled{opacity:.5;cursor:default}
